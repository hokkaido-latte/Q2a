<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <script src="https://code.jquery.com/jquery-3.2.1.min.js"></script>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.1/css/bootstrap.min.css"
          integrity="sha384-WskhaSGFgHYWDcbwN70/dfYBj47jz9qbsMId/iRN3ewGhXQFZCSftd1LZCfmhktB" crossorigin="anonymous">
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.1.1/js/bootstrap.min.js"
            integrity="sha384-smHYKdLADwkXOn1EmN1qk/HfnUcbVRZyYmZ4qpPea6sjB/pTJ0euyQp0Mk8ck+5T"
            crossorigin="anonymous"></script>
    <script defer src="https://use.fontawesome.com/releases/v5.0.13/js/all.js"
            integrity="sha384-xymdQtn1n3lH2wcu0qhcdaOpQwyoarkgLVxC/wZ5q7h9gHtxICrpcaSUfygqZGOe"
            crossorigin="anonymous"></script>
    <link href="https://fonts.googleapis.com/css?family=Montserrat" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/custom.css')}}">
    <title>SG Library</title>
</head>

<body>
    <nav class="navbar navbar-light fixed-top">
        <button class="navbar-toggler ml-auto mb-2 bg-light d-md-none" type="button" data-toggle="collapse" data-target="#mySidebar">
            <span class="navbar-toggler-icon"></span>
        </button>
    </nav>

    <div class="container-fluid">
        <div class="row">

            <div class="col-xl-2 col-lg-3 col-md-4 sidebar collapse d-md-block" id="mySidebar">
                <a href="#" class="navbar-brand text-white d-block mx-auto text-center py-3 mb-4 bottom-border">
                    SG Library
                </a>
                <ul class="navbar-nav flex-column mt-4">
                    <li class="nav-item">
                        <a href="/books" class="nav-link text-white p-3 mb-2 sidebar-link">
                            <i class="fas fa-address-card text-light fa-lg mr-3"></i>Book Titles
                        </a>
                    </li>
                </ul>
            </div>
            <div class="col-xl-10 col-lg-9 col-md-8 ml-auto main-content-wrapper">

                <div class="row align-items-center py-2 top-navbar">
                    <div class="col-md-4">
                        <br />
                        <h4 class="text-dark text-uppercase mb-0">{{ panel }}</h4>
                    </div>
                </div>
                <div class="scrollable-content">
                    {% block mainblock %}
                    {% endblock %}

                </div>
            </div>
        </div>
    </div>
</body>
</html>
